[package]
name = "pi-command-not-found-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "command-not-found handler that asks pi for a command and prints the shell code to run it"
publish = false

[[bin]]
name = "command-not-found-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
console = "0.16"
dirs = "7.0"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4"
terminal-colorsaurus = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
